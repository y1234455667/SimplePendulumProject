<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Pendulum C++ Simulation Engine</title>
    <link rel="stylesheet" href="aesthetix.css">
</head>
<body>
    <div class="container">
        <h1>Simple Pendulum Simulation Engine</h1>
        
        <!-- Main Simulation Canvas -->
        <div class="canvas-container">
            <canvas id="pendulumCanvas" width="800" height="420"></canvas>
        </div>

        <!-- Live Telemetry Readout -->
        <div class="telemetry-panel">
            <div class="stat-card">
                <span class="label">Simulation Time</span>
                <span id="timeVal" class="value">0.00 s</span>
            </div>
            <div class="stat-card">
                <span class="label">Current Angle (&theta;)</span>
                <span id="currentAngleVal" class="value">0.00&deg;</span>
            </div>
            <div class="stat-card">
                <span class="label">Angular Velocity (&omega;)</span>
                <span id="omegaVal" class="value">0.00 rad/s</span>
            </div>
        </div>

        <!-- Oscillation Period Log Panel -->
        <div class="period-panel">
            <h3>Cycle Periods (To-And-Fro)</h3>
            <div id="periodList" class="period-list">
                <span class="placeholder-text">Awaiting completed swing cycles...</span>
            </div>
        </div>

        <!-- Interactive Sliders & Controls -->
        <div class="controls-panel">
            <div class="sliders-grid">
                <div class="control-group">
                    <div class="label-row">
                        <label for="lengthSlider">String Length (L)</label>
                        <span class="slider-readout"><span id="lengthVal">1.0</span> m</span>
                    </div>
                    <input type="range" id="lengthSlider" min="0.1" max="4.0" step="0.1" value="1.0">
                </div>

                <div class="control-group">
                    <div class="label-row">
                        <label for="angleSlider">Starting Angle (&theta;<sub>0</sub>)</label>
                        <span class="slider-readout"><span id="angleVal">5.0</span>&deg;</span>
                    </div>
                    <!-- Expanded to -20 to +20 degrees -->
                    <input type="range" id="angleSlider" min="-20.0" max="20.0" step="0.5" value="5.0">
                </div>
            </div>

            <div class="buttons-row">
                <button id="playBtn" class="btn">Pause</button>
                <button id="resetBtn" class="btn secondary">Restart Swing</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
